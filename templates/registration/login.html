{% extends "base.html" %}
{% block title %}Log in · PetalCare{% endblock %}
{% block content %}
<div class="card">
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
